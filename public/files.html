<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Files: AuthorTrail</title></head><body><main class="wide"><h1 style="font-size:2.4rem">Your files</h1><p class="lead">Copies of your work saved to your account. Turn "Save a copy of my text" on in the editor, or enable Cloud save in the VS Code extension.</p><div id="body"></div></main><script src="app.js"></script><script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
(async()=>{let r;try{r=await api('files')}catch(e){$('#body').innerHTML='<p class="msg bad">'+esc(e.message)+'</p>';return}
if(!r.length){$('#body').innerHTML='<div class="panel"><h3>No files yet</h3><p class="note" style="margin:0">Write in the <a href="write.html">editor</a> with the copy option ticked, then save a checkpoint.</p></div>';return}
$('#body').innerHTML=`<div class="panel wrap"><table><thead><tr><th>File</th><th>Document</th><th>Size</th><th>Saved</th><th></th></tr></thead><tbody>${r.map((f,i)=>`<tr><td>${esc(f.name)}</td><td>${esc(f.title)}</td><td>${f.size.toLocaleString()} characters</td><td>${new Date(f.updatedAt).toLocaleString()}</td><td><button class="btn ghost sm" data-v="${i}">View</button> <button class="btn ghost sm" data-d="${i}">Download</button></td></tr>`).join('')}</tbody></table></div><div id="view" style="margin-top:16px"></div>`;
const get=async f=>(await api('docs/'+f.docId+'/files')).files.find(x=>x.name===f.name);
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=async()=>{const f=await get(r[b.dataset.v]),v=$('#view');v.innerHTML='<div class="panel"><h3></h3><pre style="white-space:pre-wrap;margin:0"></pre></div>';v.querySelector('h3').textContent=f.name;v.querySelector('pre').textContent=f.content});
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{const m=r[b.dataset.d],f=await get(m),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([f.content],{type:'text/plain'}));a.download=m.name.split('/').pop();a.click()})})();
</script></body></html>
