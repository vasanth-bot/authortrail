<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title> Classroom: AuthorTrail</title></head><body><main class="wide"><h1 style="font-size:2.4rem">Classroom</h1><p class="lead">Teachers create a class, students submit their records, and flags show what needs a closer look.</p>
<div class="panel"><h3>Create a class</h3><div class="row"><input id="cn" placeholder="Class name, for example English 101" aria-label="Class name" style="flex:1;min-width:220px"><button class="btn" id="mk">Create class</button></div><p class="msg" id="err"></p></div>
<div id="list" style="margin-top:18px"></div><div id="view"></div>
<div class="panel" style="margin-top:28px"><h3>Students</h3><p class="note" style="margin:0">On your <a href="write.html">Dashboard</a>, choose <b>Submit to class</b> beside a document, then enter the join code and your name.</p></div></main><script src="app.js"></script><script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function list(){try{const cs=await api('classes');$('#list').innerHTML=cs.length?'<div class="panel"><h3>Your classes</h3><ul class="docs">'+cs.map(c=>`<li class="docrow"><div><strong>${esc(c.name)}</strong><div class="note">Join code <code>${c.joinCode}</code>, ${c.count} submission${c.count==1?'':'s'}</div></div><button class="btn ghost sm" data-c="${c.id}">View submissions</button></li>`).join('')+'</ul></div>':'';
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>open(b.dataset.c))}catch(e){$('#err').textContent=e.message}}
async function open(id){const c=await api('classes/'+id);$('#view').innerHTML=`<h2>${esc(c.name)}</h2><div class="row" style="margin-bottom:10px"><span class="note">Join code <code>${c.joinCode}</code></span><button class="btn ghost sm" id="csv">Export CSV</button></div><div class="panel wrap"><table><thead><tr><th>Student</th><th>Document</th><th>Originality</th><th>Integrity</th><th>Flags</th><th></th></tr></thead><tbody>${c.rows.map(r=>`<tr><td>${esc(r.student)}</td><td>${esc(r.title)}</td><td>${r.score==null?'n/a':r.score+'%'}</td><td>${r.intact?'Intact':'Broken'}</td><td>${r.flags.map(f=>'<span class="pill low">'+esc(f)+'</span>').join('')||'<span class="pill ok">None</span>'}</td><td>${r.docId?'<a href="verify.html?id='+r.docId+'">Record</a>':''}</td></tr>`).join('')||'<tr><td colspan="6" class="note">No submissions yet. Share the join code with your students.</td></tr>'}</tbody></table></div>`;
$('#csv').onclick=async()=>{const t=await fetch('/api/classes/'+id+'/csv',{headers:{'x-library-code':libCode()}}).then(r=>r.text()),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='class-'+id+'.csv';a.click()};scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
$('#mk').onclick=async()=>{$('#err').textContent='';const name=$('#cn').value.trim();if(!name)return $('#err').textContent='Enter a class name.';try{await api('classes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});$('#cn').value='';list()}catch(e){$('#err').textContent=e.message}};list();
</script></body></html>
