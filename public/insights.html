<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title> Insights: AuthorTrail</title></head><body><main class="wide"><h1 style="font-size:2.4rem">Insights</h1><p class="lead">Your writing activity across every document linked to your connection code.</p><div id="body"></div></main><script src="app.js"></script><script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
(async()=>{let r;try{r=await api('insights')}catch(e){$('#body').innerHTML='<p class="msg bad">'+esc(e.message)+'</p>';return}
if(!r.docs.length){$('#body').innerHTML='<div class="panel"><h3>No data yet</h3><p class="note">Write on the <a href="write.html">Dashboard</a>, or connect VS Code or your browser from the <a href="setup.html">setup guide</a>.</p></div>';return}
const goal=Number(localStorage.getItem('at.goal'))||500,map=Object.fromEntries(r.days.map(d=>[d.day,d])),days=[];
for(let i=29;i>=0;i--){const k=new Date(Date.now()-i*864e5).toISOString().slice(0,10);days.push(map[k]||{day:k,typed:0,pasted:0,activeMin:0})}
const max=Math.max(1,...days.map(d=>d.typed+d.pasted)),today=days.at(-1),sc=r.docs.filter(d=>d.score!=null),avg=sc.length?Math.round(sc.reduce((a,d)=>a+d.score,0)/sc.length)+'%':'n/a',pct=Math.min(100,Math.round(today.typed/goal*100));
$('#body').innerHTML=`<div class="cards"><div class="panel"><b>${r.streak}</b><span>day streak</span></div><div class="panel"><b>${r.totals.typed.toLocaleString()}</b><span>characters typed</span></div><div class="panel"><b>${(r.totals.activeMin/60).toFixed(1)}</b><span>hours of active writing</span></div><div class="panel"><b>${avg}</b><span>average originality</span></div></div>
<h2>Daily goal</h2><div class="panel"><div class="row" style="justify-content:space-between"><span>Today: <b>${today.typed}</b> of <b>${goal}</b> characters typed</span><span class="row"><label for="g" class="note">Goal</label><input id="g" type="number" min="50" step="50" value="${goal}" style="width:100px"></span></div><div class="bar"><i style="width:${pct}%"></i></div></div>
<h2>Last 30 days</h2><div class="panel"><div class="chart">${days.map(d=>`<div class="col" title="${d.day}: ${d.typed} typed, ${d.pasted} pasted"><span class="t" style="height:${d.typed/max*100}%"></span><span class="p" style="height:${d.pasted/max*100}%"></span></div>`).join('')}</div><div class="key"><span><i></i>Typed</span><span><i class="p"></i>Pasted</span></div></div>
<h2>Documents</h2><div class="panel wrap"><table><thead><tr><th>Title</th><th>Source</th><th>Checkpoints</th><th>Originality</th><th></th></tr></thead><tbody>${r.docs.map(d=>`<tr><td>${esc(d.title)}</td><td>${{vscode:'VS Code',browser:'Browser'}[d.source]||'Editor'}</td><td>${d.checkpoints}</td><td>${d.score==null?'n/a':d.score+'%'}</td><td><a href="verify.html?id=${d.id}">Record</a></td></tr>`).join('')}</tbody></table></div>`;
$('#g').onchange=e=>{localStorage.setItem('at.goal',Math.max(50,Number(e.target.value)||500));location.reload()}})();
</script></body></html>
